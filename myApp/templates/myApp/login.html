{% extends 'myApp/base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width:60px;height:60px;font-size:1.7rem;">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Iniciar sesión</h3>
                    <p class="text-muted small">Ingresá tus credenciales para acceder a EduControl</p>
                </div>

                {% if error %}
                <div class="alert alert-danger py-2 small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                </div>
                {% endif %}

                <form method="POST" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold text-secondary small">Usuario</label>
                        <input type="text"
                               name="username"
                               id="id_username"
                               class="form-control"
                               value="{{ request.POST.username|default:'' }}"
                               autofocus
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold text-secondary small">Contraseña</label>
                        <input type="password"
                               name="password"
                               id="id_password"
                               class="form-control"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
