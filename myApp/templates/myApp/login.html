{% extends 'myApp/base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block contenido %}
<style>
    .login-wrap { max-width: 414px; }
    .login-wrap .card-body { padding: 13px; }
    .login-wrap h3 { font-size: 1.15rem; }
    @media (max-width: 575.98px) {
        .login-wrap { max-width: 100%; }
    }
</style>
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 160px);">
    <div class="col-12 login-wrap mx-auto">

        <div class="card shadow border-0 rounded-4">
            <div class="card-body">

                <div class="text-center mb-3">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-2" style="width:46px;height:46px;font-size:1.05rem;">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Iniciar sesión</h3>
                    <p class="text-muted small mb-0">Ingresá tus credenciales para acceder a EduControl</p>
                </div>

                {% if error %}
                <div class="alert alert-danger py-2 small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                </div>
                {% endif %}

                <form method="POST" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold text-secondary small">Usuario</label>
                        <input type="text"
                               name="username"
                               id="id_username"
                               class="form-control"
                               value="{{ request.POST.username|default:'' }}"
                               autofocus
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-semibold text-secondary small">Contraseña</label>
                        <input type="password"
                               name="password"
                               id="id_password"
                               class="form-control"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-semibold rounded-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
