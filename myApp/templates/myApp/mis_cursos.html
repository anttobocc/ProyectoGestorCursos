{% extends 'myApp/base.html' %}

{% block title %}Mis Cursos{% endblock %}

{% block contenido %}
<style>
    .custom-card {
        border: none;
        border-radius: 16px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        background: #ffffff;
    }
    .custom-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
    }
    .card-icon-avatar {
        width: 48px;
        height: 48px;
        background-color: #e0f2fe;
        color: #0369a1;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        flex-shrink: 0;
    }
</style>

<!-- Encabezado -->
<div class="row align-items-center mb-4 mb-md-5 g-3">
    <div class="col-12 text-center text-md-start">
        <h1 class="fw-bold text-dark mb-1">Mis Cursos</h1>
        <p class="text-muted mb-0">Comisiones a tu cargo.</p>
    </div>
</div>

<!-- Grilla de Cursos -->
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 g-md-4">
    {% for curso in cursos %}
    <div class="col">
        <div class="card h-1
